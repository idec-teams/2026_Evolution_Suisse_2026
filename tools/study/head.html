<title>Graphite Capsid Study</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#FAF8F4; --paper-sunk:#F2EFE8; --rule:#DFD9CE; --rule-soft:#EAE5DB;
  --ink:#14171C; --ink-muted:#5B6068; --ink-faint:#8C9099;
  --accent:#A84D1C; --accent-deep:#8A3D14;
  --graphite:#3A3733;
  --font-display:"Fraunces","Iowan Old Style",Palatino,Georgia,serif;
  --font-body:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
/* Dark theme is chalk on slate, not an inverted photocopy: the drawing stays a
   drawing, the ground becomes board. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1B1A18; --paper-sunk:#232120; --rule:#3A3733; --rule-soft:#2C2A28;
    --ink:#EDEAE3; --ink-muted:#A29C92; --ink-faint:#736D64;
    --accent:#E08B54; --accent-deep:#F0A876; --graphite:#DCD6CB;
  }
}
:root[data-theme="dark"]{
  --paper:#1B1A18; --paper-sunk:#232120; --rule:#3A3733; --rule-soft:#2C2A28;
  --ink:#EDEAE3; --ink-muted:#A29C92; --ink-faint:#736D64;
  --accent:#E08B54; --accent-deep:#F0A876; --graphite:#DCD6CB;
}

body{background:var(--paper);color:var(--ink);font-family:var(--font-body);
     font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.wrap{max-width:1080px;margin:0 auto;padding:48px 28px 96px}

/* ── Masthead ─────────────────────────────────────────────────────────── */
.mast{border-bottom:1px solid var(--rule);padding-bottom:22px;margin-bottom:36px}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.14em;
         text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font-family:var(--font-display);font-weight:600;font-size:clamp(28px,4vw,42px);
   line-height:1.1;margin:0 0 12px;text-wrap:balance;letter-spacing:-.01em}
.standfirst{margin:0;max-width:62ch;color:var(--ink-muted);font-size:16px}
.provenance{display:flex;flex-wrap:wrap;gap:0 26px;margin:20px 0 0;padding:0;
            list-style:none;font-family:var(--font-mono);font-size:12px;
            color:var(--ink-muted);font-variant-numeric:tabular-nums}
.provenance b{color:var(--ink);font-weight:500}
.provenance a{color:var(--accent);text-decoration:none;border-bottom:1px solid var(--rule)}
.provenance a:hover{color:var(--accent-deep)}

h2{font-family:var(--font-display);font-weight:600;font-size:22px;margin:0 0 6px;
   letter-spacing:-.005em}
.section{margin-top:56px}
.section > p.note{margin:0 0 24px;color:var(--ink-muted);max-width:60ch}

/* ── Plates ───────────────────────────────────────────────────────────── */
.plates{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:36px 34px}
@media (max-width:640px){.plates{grid-template-columns:1fr}}
.plate{display:flex;flex-direction:column;gap:0}
.plate canvas{width:100%;aspect-ratio:1;display:block;background:var(--paper-sunk);
              border:1px solid var(--rule)}
.plate h3{margin:12px 0 2px;font-size:15px;font-weight:600;
          display:flex;align-items:baseline;gap:8px}
.plate h3 span.key{font-family:var(--font-mono);color:var(--accent);font-size:13px}
.plate p{margin:0 0 10px;color:var(--ink-muted);font-size:13.5px}
/* Spec rows are data, not a card: hairlines only, no fill, no radius. */
.spec{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:11.5px;
      font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.spec th{text-align:left;font-weight:400;padding:3px 0;border-top:1px solid var(--rule-soft);
         letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;color:var(--ink-faint)}
.spec td{text-align:right;padding:3px 0;border-top:1px solid var(--rule-soft);color:var(--ink)}

/* ── Workbench ────────────────────────────────────────────────────────── */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:36px;align-items:start}
@media (max-width:820px){.bench{grid-template-columns:1fr}}
.bench canvas{width:100%;max-width:520px;aspect-ratio:1;display:block;
              background:var(--paper-sunk);border:1px solid var(--rule)}
.controls{display:flex;flex-direction:column;gap:14px}
.ctl{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.ctl label{font-size:12.5px;color:var(--ink-muted)}
.ctl output{font-family:var(--font-mono);font-size:12px;color:var(--ink);
            font-variant-numeric:tabular-nums}
.ctl input{grid-column:1/-1;width:100%;accent-color:var(--accent);margin:0}
.ctl input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
button{font-family:var(--font-body);font-size:13px;color:var(--ink);background:none;
       border:1px solid var(--rule);padding:7px 12px;cursor:pointer;align-self:flex-start}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
pre{font-family:var(--font-mono);font-size:11.5px;line-height:1.55;margin:0;
    padding:12px;background:var(--paper-sunk);border:1px solid var(--rule-soft);
    color:var(--ink);overflow-x:auto;white-space:pre-wrap;word-break:break-word;-moz-tab-size:2;tab-size:2}
.hint{font-size:12.5px;color:var(--ink-faint);margin:10px 0 0}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--rule);
       font-size:12.5px;color:var(--ink-muted)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
