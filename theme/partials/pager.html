{%- if page and (page.previous_page or page.next_page) %}
<nav class="pager" aria-label="Page navigation">
  {%- if page.previous_page %}
  <a class="pager__link pager__link--prev" href="{{ page.previous_page.url|url }}">
    <span class="pager__dir">Previous</span>
    <span class="pager__title">{{ page.previous_page.title }}</span>
  </a>
  {%- else %}<span></span>{% endif %}
  {%- if page.next_page %}
  <a class="pager__link pager__link--next" href="{{ page.next_page.url|url }}">
    <span class="pager__dir">Next</span>
    <span class="pager__title">{{ page.next_page.title }}</span>
  </a>
  {%- endif %}
</nav>
{%- endif %}
